# Blueprint de Render - plan FREE (solo pruebas).
# Servicio Baileys (sin navegador) -> ligero, entra en 512 MB.
# Sin disco persistente: si el servicio se reinicia/duerme, hay que
# volver a escanear el QR en /qr.
services:
  - type: web
    name: biblioteca-whatsapp
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SITE_BASE_URL
        value: https://bibliotecaiemr.infy.click
